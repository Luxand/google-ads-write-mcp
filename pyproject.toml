[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-ads-write-mcp"
version = "0.5.0"
description = "Allow-listed write-side MCP server for Google Ads (dry run by default), plus Keyword Planner ideas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "google-ads==31.4.0",
  "mcp>=1.9,<2",
]
keywords = ["google-ads", "mcp", "model-context-protocol", "claude"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Luxand/google-ads-write-mcp"

[project.scripts]
google-ads-write-mcp = "google_ads_write_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_write_mcp"]
